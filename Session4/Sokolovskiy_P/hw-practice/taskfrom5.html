        // task 11
        const config = {
            studyName: "Stroop Task",
            numTrials: 40,
            conditions: ["congruent", "incongruent", "neutral"],
            minAge: 18,
            maxAge: 40
        };
        const participant = {
            id: "P001",
            age: 54,
            consentGiven: "yes",
            completedBefore: "no"
        };
        function checkParticipant (participant, config) {
            if (participant.age >= config.minAge && participant.age <= config.maxAge) {
                return("Eligible")
            } else {
                console.log(`Cannot start: participant ${participant.id} is not eligible.`);
                console.log(`Reason: age out of range (${participant.age} not in 18-40)`);
            }
        }
        function startExperiment (participant, config) {
            if (checkParticipant (participant, config) == "Eligible") {
                console.log(`Starting experiment: ${config.studyName}`);
                console.log(`Participant: ${participant.id} | Age: ${participant.age}`);
                console.log(`Trials: ${config.numTrials} | Conditions: ${config.conditions}`)
            }
        }
        startExperiment(participant, config);
