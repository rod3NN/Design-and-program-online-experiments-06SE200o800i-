        // Task 6
        const jsPsych = initJsPsych();
        const welcome = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: "Press any key to start",
            choices: "ALL_KEYS"
        }
        function drawfn (canvas) {
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "black";
            ctx.fillRect(180, 195, 40, 10);  // horizontal bar
            ctx.fillRect(195, 180, 10, 40);
        }
        const fixation = {
            type: jsPsychCanvasKeyboardResponse,
            canvas_size: [400, 400],
            trial_duration: 1000,
            choices: "NO_KEYS",
            stimulus: drawfn
        }
        jsPsych.run([welcome, fixation]);
