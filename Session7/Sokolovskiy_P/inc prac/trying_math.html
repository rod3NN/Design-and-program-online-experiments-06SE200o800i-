<body>
    <script>
        console.log(Math.random());
        function getRandomBetween (min, max) {
            return Math.random() * (max - min) + min;
        }
        console.log(Math.floor(getRandomBetween(1,5)));
        console.log(Math.ceil(getRandomBetween(1,5)));
        console.log(Math.round(getRandomBetween(1,5)));
    </script>
</body>
