<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .task-title {
            color: blanchedalmond;
        }
        .key-hint {
            background: #242835;
            padding: 8px 16px;
        }
    </style>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.3"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
</head>
<body>
    <script>
        // Initialize
        const jsPsych = initJsPsych({
            on_finish: () => {
                jsPsych.data.get().localSave('csv', 'stroop_data.csv');
            }
        });

        //Data Prop
        jsPsych.data.addProperties({
            participant_id: 'P001',
            experiment: 'canvas stroop',
        });

        // Stimuli 
        const stimuli = [
            { word: 'RED',   ink: 'blue',  correct_key: 'b' },
            { word: 'BLUE',  ink: 'red',   correct_key: 'r' },
            { word: 'GREEN', ink: 'red',   correct_key: 'r' },
            { word: 'RED',   ink: 'green', correct_key: 'g' },
        ];

        //Trials
        const stroopTrials = stimuli.map(s => ({
            type: jsPsychCanvasKeyboardResponse,
            canvas_size: [400, 400],
            stimulus: (canvas) => {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = s.ink;
                ctx.textAlign = 'center';
                ctx.fillText(s.word, 200, 200);
            },
            choices: ['r', 'g', 'b'],
            data: {
                phase: 'stroop',
                word: s.word,
                ink: s.ink,
                correct_key: s.correct_key,
            },
            on_finish: (data) => {
                data.correct = data.response === data.correct_key ? true : false;
            },
        }));

        //Instructions
        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <h2 class="task-title">Canvas Stroop Task</h2>
                <p>You will see color words drawn in a <strong>different</strong> ink color.</p>
                <p>Press the key for the <em>ink color</em>, not the word:</p>
                <p class="key-hint"><strong>r</strong> = red &nbsp; <strong>g</strong> = green &nbsp; <strong>b</strong> = blue</p>
                <p><em>Press any key to start.</em></p>`,
            choices: "ALL_KEYS",
            data: {phase: 'instruction'},
        };

        const endScreen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: () => {
                const nCorrect = jsPsych.data.get()
                .filter({ phase: 'stroop', correct: true }).count();
                const nTotal = jsPsych.data.get()
                .filter({ phase: 'stroop' }).count();
                return `<h2>Done!</h2><p>You got ${nCorrect} / ${nTotal} correct.</p>
                        <p><em>Press any key to finish. Data will be saved as CSV.</em></p>`;
            },
            choices: "ALL_KEYS",
            data: { phase: 'end' },
        };
        const timeline = [instructions, ...stroopTrials, endScreen];
        jsPsych.run(timeline);
    </script>
</body>
</html>
